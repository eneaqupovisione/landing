<!DOCTYPE html>

<script id="demo-data-shim">
/* DEMO — serve la stessa carta finta (carta-demo.json) al posto di Supabase,
   cosi' Scopri/Mappa/Scelte mostrano gli STESSI vini della Carta. */
(function(){
  var _fetch = window.fetch ? window.fetch.bind(window) : null;
  var _cache = null;
  function resp(data){ return { ok:true, status:200,
    json:function(){ return Promise.resolve(data); },
    text:function(){ return Promise.resolve(JSON.stringify(data)); },
    headers:{ get:function(){ return null; } } }; }
  function load(){
    if(_cache) return Promise.resolve(_cache);
    return _fetch('carta-demo.json').then(function(r){ return r.json(); })
      .then(function(d){ _cache = d || {}; return _cache; })
      .catch(function(){ _cache = {}; return _cache; });
  }
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input && input.url) || '';
    if(url.indexOf('/rest/v1/carta_vini') >= 0)     return load().then(function(d){ return resp(d.carta_vini || []); });
    if(url.indexOf('/rest/v1/carta_settings') >= 0) return load().then(function(d){ return resp(d.carta_settings || []); });
    if(url.indexOf('demo.invalid') >= 0 || url.indexOf('/rest/v1/') >= 0) return Promise.resolve(resp([]));
    return _fetch ? _fetch(input, init) : Promise.reject(new Error('offline'));
  };
})();
</script>

    --region-empty:#12202b;        /* regione senza vini */

    --ink:#f2ead9; --ink-2:#e9dcc3;
    --paper:#2a2012; --paper-dim:#6e5f45;
    --gold:#9c7420; --gold-soft:#7c5c17;
    --line:#c9b98f; --line-soft:#dccdaa;
    --dead:#ddceb0;
    --natborder-line:#5a554e;   /* confine paesi: grigio scuro (light) */

    --ctx-land-line:#c7b48a;
    --region-empty:#ded0b2;

  .cat-bollicine{--c-strong:#c9a52a;--c-glow:#e8c94f}
  .cat-champagne{--c-strong:#c49a3a;--c-glow:#e0c274}
  .cat-bianco{--c-strong:#3aa066;--c-glow:#5fd08c}
  .cat-fermi{--c-strong:#3aa066;--c-glow:#5fd08c}
  .cat-rosso{--c-strong:#c94848;--c-glow:#e87070}
  .cat-rose{--c-strong:#d16690;--c-glow:#f090b6}
  .cat-stranieri{--c-strong:#7a72e0;--c-glow:#a29bf5}
  .cat-emilia{--c-strong:#d0662a;--c-glow:#f0904a}
  .cat-piccoli{--c-strong:#2b88d8;--c-glow:#5fb0f0}
  /* palette dei territori (colorazione a grafo: 7 colori distinti) */
  .cat-giallo{--c-strong:#d6a42a;--c-glow:#f0c94f}
  .cat-verde{--c-strong:#3f9d5f;--c-glow:#63c987}
  .cat-viola{--c-strong:#8a67cf;--c-glow:#ac93ef}
  .cat-blu{--c-strong:#3f83c4;--c-glow:#6fb0ef}
  .cat-arancione{--c-strong:#d98a3c;--c-glow:#f0a95f}
  .cat-rosa{--c-strong:#d1689e;--c-glow:#f090bd}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 800px at 30% -10%, #16293a 0%, transparent 60%),
      radial-gradient(900px 700px at 100% 120%, #1a1220 0%, transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    transition:background .4s ease, color .4s ease;
  }
  body.light{
    background:
      radial-gradient(1200px 800px at 30% -10%, #fff6e4 0%, transparent 60%),
      radial-gradient(900px 700px at 100% 120%, #f0e2c8 0%, transparent 55%),
      var(--ink);
  }
  .wrap{position:relative;width:100vw;height:100vh;display:flex}
  .head{position:absolute;top:22px;left:26px;z-index:20;pointer-events:none;
    background:#0e1c28cc;border:0.5px solid #24384a;border-radius:14px;
    padding:14px 20px 16px;backdrop-filter:blur(6px);transition:background .4s,border-color .4s}
  body.light .head{background:#fffaf0d0;border-color:#cbb48a}
  .eyebrow{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;letter-spacing:.42em;
    text-transform:uppercase;color:var(--gold);opacity:.85;font-weight:600}
  .head h1{font-size:clamp(22px,2.6vw,34px);font-weight:500;margin-top:6px;line-height:1.02}
  .head h1 em{font-style:italic;color:var(--gold-soft)}

  /* selettore paese */
  .country-bar{position:absolute;top:22px;right:26px;z-index:25;display:flex;gap:6px;
    background:#0e1d29cc;border:1px solid #263b4d;border-radius:40px;padding:5px;
    backdrop-filter:blur(6px);font-family:'Helvetica Neue',Arial,sans-serif}
  .country-btn{border:none;background:transparent;color:var(--paper-dim);cursor:pointer;
    font-size:13px;letter-spacing:.03em;padding:8px 15px;border-radius:30px;transition:.2s;white-space:nowrap}
  .country-btn:hover{color:var(--paper)}
  .country-btn.active{background:var(--gold);color:#1a1206;font-weight:600}
  body.light .country-btn.active{color:#fff}
  body.light .country-bar{background:#fffaf0cc;border-color:#cbb48a}

    .country-bar{top:auto;bottom:18px;right:50%;transform:translateX(50%);padding:4px}
    .country-btn{font-size:12px;padding:7px 12px}
    .head{top:14px;left:14px;padding:11px 15px 12px}
  }

  .theme-toggle{position:absolute;top:22px;right:26px;z-index:26;width:40px;height:40px;
    border:1px solid #263b4d;border-radius:50%;background:#0e1d29cc;color:var(--paper);
    font-size:17px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);
    transition:.2s;line-height:1}
  .theme-toggle:hover{border-color:var(--gold);transform:scale(1.08)}
  body.light .theme-toggle{background:#ffffffcc;border-color:#cbb48a}
  /* la country-bar si sposta a sinistra del toggle */
  .country-bar{right:76px}
  @media (max-width:720px){
    .theme-toggle{top:16px;right:16px;width:36px;height:36px;font-size:15px}
  }
  .stage{position:relative;flex:1;min-width:0}
  svg.map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  svg.map.grabbing{cursor:grabbing}

  /* sagome di contesto: paesi vicini senza vini, solo per orientarsi.
     Nessun bordo: evita doppi-contorni sotto i confini nazionali (es. Corsica). */
  .ctx-land{fill:var(--ctx-land);stroke:none;stroke-linejoin:round;
    pointer-events:none;transition:fill .4s}
  /* regione senza vini (Italia o estero): spenta, non interattiva */
  .region.empty{fill:var(--region-empty);stroke:var(--region-empty-line);stroke-width:.7;
    pointer-events:none;transition:fill .4s,stroke .4s}
  /* CONFINE NAZIONALE: linea marcata sopra le regioni, bianca (dark) / nera (light) */
  .natline{fill:none;stroke:var(--natborder-line);stroke-width:1.3;
    stroke-linejoin:round;stroke-linecap:round;pointer-events:none;paint-order:stroke;
    opacity:.5;transition:opacity .25s,stroke-width .25s,stroke .4s}
  .natline.solo{stroke-width:1.2;opacity:.65}
  .natline.hot{opacity:1;stroke-width:2.4}

  /* nodi-zona vinicola (esteri) */
  .node{cursor:pointer}
  .z-halo{fill:var(--c-glow);opacity:.16;transform-box:fill-box;transform-origin:center;
    animation:zbreathe 4.5s ease-in-out infinite}
  @keyframes zbreathe{0%,100%{transform:scale(1);opacity:.16}50%{transform:scale(1.4);opacity:.06}}
  .z-ring{fill:none;stroke:var(--c-glow);stroke-width:1;opacity:0;transform-box:fill-box;
    transform-origin:center;transition:opacity .25s,transform .3s cubic-bezier(.34,1.4,.5,1)}
  .z-dot{fill:var(--c-strong);stroke:var(--ink);stroke-width:1.4;
    filter:drop-shadow(0 0 6px var(--c-glow))}
  .z-count{font-family:'Helvetica Neue',Arial,sans-serif;font-size:10px;font-weight:700;
    fill:var(--ink);text-anchor:middle}
  .z-name{font-family:'Iowan Old Style',Palatino,Georgia,serif;font-size:12.5px;fill:var(--paper);
    text-anchor:middle;paint-order:stroke;stroke:var(--ink);stroke-width:3.5px;stroke-linejoin:round}
  .node.hot .z-ring{opacity:.9;transform:scale(1.15)}
  .node.hot .z-halo{opacity:.34}
  .node.hot .z-dot{filter:drop-shadow(0 0 12px var(--c-glow))}
  .node.hot .z-name{fill:var(--c-glow)}
  .region{fill:var(--c-strong);fill-opacity:.15;stroke:var(--c-strong);stroke-opacity:.5;
    stroke-width:1.1;stroke-linejoin:round;cursor:pointer;
    transition:fill-opacity .28s,stroke-opacity .28s,stroke-width .28s,filter .28s}
  .region.hot{fill-opacity:.6;stroke:var(--c-glow);stroke-opacity:1;stroke-width:2;
    filter:drop-shadow(0 0 26px var(--c-glow)) drop-shadow(0 6px 14px rgba(0,0,0,.5))}

  .nodes text{pointer-events:none}
  .rcount{font-family:'Helvetica Neue',Arial,sans-serif;font-size:11px;font-weight:700;
    fill:var(--gold-soft);text-anchor:middle;paint-order:stroke;stroke:var(--ink);stroke-width:3px;transition:opacity .25s}
  .rname{font-family:'Iowan Old Style',Palatino,Georgia,serif;font-weight:600;font-size:14px;
    fill:var(--paper);text-anchor:middle;paint-order:stroke;stroke:var(--ink);stroke-width:4px;
    stroke-linejoin:round;opacity:0;transition:opacity .25s}

  .label-wrap.hot .rcount{opacity:0}

  .legend{position:absolute;left:30px;bottom:24px;z-index:20;font-family:'Helvetica Neue',Arial,sans-serif;

    padding:13px 15px;backdrop-filter:blur(6px);transition:background .4s,border-color .4s}
  body.light .legend{background:#fffaf0d0;border-color:#cbb48a}
  .panel-head{margin-bottom:9px}
  .panel-name{display:block;font-family:'Iowan Old Style',Palatino,Georgia,serif;
    font-size:19px;font-weight:500;color:var(--paper);line-height:1.05}
  .panel-meta{display:block;font-size:11.5px;color:var(--paper-dim);margin-top:2px}
  .panel-meta b{color:var(--gold-soft);font-weight:600}
  .panel-bars{display:flex;flex-direction:column;gap:6px}
  .pbar{display:flex;align-items:center;gap:8px}
  .pbar-lab{width:78px;font-size:11.5px;color:var(--paper-dim);white-space:nowrap}
  .pbar-track{flex:1;height:6px;background:#1a2a36;border-radius:4px;overflow:hidden}

    padding:12px 14px;margin-bottom:8px;border-radius:12px;

    background:color-mix(in srgb, var(--c-strong,#8a7b55) 7%, transparent);

    background:color-mix(in srgb,var(--c-strong,#8a7b55) 12%, transparent);border-radius:20px;padding:2px 9px}
  /* ---- LIGHT MODE: superficie crema, coerente col resto dell'app ---- */
  body.light .modal-back{background:rgba(60,44,20,.38)}
  body.light .modal{background:#fffdf8;border-color:#e6d8bf;box-shadow:0 26px 70px rgba(70,50,15,.28)}
  body.light .m-head{border-bottom-color:#ece0c8}
  body.light .m-list::-webkit-scrollbar-thumb{background:#d8c8a8}
  body.light .wine{border-color:#ece0c8}
</style>

const ITALIAN_IDS=['piemonte','valaosta','lombardia','trentino','veneto','friuli','liguria',
  'emilia','toscana','marche','abruzzo','campania','puglia','sicilia','sardegna',

/* configurazione paesi: bbox per zoom vincolato */
const ITALY_BBOX=[505,205,981,813];
const PAESI={
  world:{label:'Mondo', bbox:[0,0,1000,760], free:true},

const svg=document.getElementById('map');

/* layer */
const gBg=document.createElementNS(nsvg,'g'); svg.appendChild(gBg);

const byId={}; let totVini=0;
TERRITORI.forEach(t=>{totVini+=t.vini.length; byId[t.id]=t;});

// COLORE DEL TERRITORIO: non più per "tipo di vino più frequente", ma un colore
// pseudo-casuale ma STABILE (dipende dall'id del territorio), scelto dentro la
// palette. Così la mappa mostra la varietà dei territori invece del tipo dominante.
const PALETTE_KEYS=['giallo','verde','rosso','viola','blu','arancione','rosa'];
function hashStr(s){ let h=0; s=String(s); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0; return Math.abs(h); }
// Colore del territorio: colorazione a grafo precalcolata (regioni adiacenti = colori
// diversi). Chiave = t.region (id regione italiana o nome regione amministrativa estera).
function catClass(t){ return (typeof REGION_COLOR!=='undefined' && REGION_COLOR[t.region]) || PALETTE_KEYS[hashStr(String(t.id))%PALETTE_KEYS.length]; }
function wineCat(w){const tg=w.tags.map(x=>x.toLowerCase());
  if(tg.some(x=>x.includes('champagne')))return 'champagne';
  if(tg.some(x=>x.includes('spumante')||x.includes('metodo classico')||x.includes('lambrusco')))return 'bollicine';
  if(tg.some(x=>x.includes('rosato')||x.includes('rosé')))return 'rose';
  if(tg.some(x=>x.includes('rosso')||x.includes('nebbiolo')||x.includes('sangiovese')||x.includes('aglianico')||x.includes('primitivo')||x.includes('cannonau')||x.includes('nerello')||x.includes('frappato')||x.includes('lagrein')||x.includes('montepulciano')||x.includes('appassimento')))return 'rosso';
  return 'bianco';}

/* indicizzo i territori esteri per (country, region) — possono essere PIÙ d'uno per regione */
const terrByRegion={};
TERRITORI.filter(t=>t.country!=='italy').forEach(t=>{
  const key=t.country+'|'+t.region;
  (terrByRegion[key]=terrByRegion[key]||[]).push(t);
});

/* ============ RENDER DEL PAESE CORRENTE ============ */
let currentCountry='world';

function clearMap(){ gBg.innerHTML=''; gRegions.innerHTML=''; gBorders.innerHTML=''; gNodes.innerHTML=''; hotId=null; }

/* disegna il confine nazionale di un paese (linea marcata sopra le regioni) */
function drawNationalBorder(country, solo){
  // Confine nazionale RIGENERATO dall'unione dei poligoni delle regioni (NAT_BORDERS):
  // combacia sempre con le regioni, isole comprese.
  const d=NAT_BORDERS[country]; if(!d)return;
  const p=document.createElementNS(nsvg,'path');
  p.setAttribute('class','natline'+(solo?' solo':''));
  p.setAttribute('d',d);
  p.dataset.country=country;
  gBorders.appendChild(p);
}

function drawRegion(pathD, cx, cy, terr, emptyName){
  const p=document.createElementNS(nsvg,'path');
  if(terr){
    p.setAttribute('class','region cat-'+catClass(terr)); p.dataset.id=terr.id;
  } else {
    p.setAttribute('class','region empty');
  }
  p.setAttribute('d',pathD); gRegions.appendChild(p);
  if(terr){
    const lab=document.createElementNS(nsvg,'g');
    lab.setAttribute('class','label-wrap'); lab.dataset.id=terr.id;
    lab.innerHTML=`<text class="rname" x="${cx}" y="${cy-6}">${terr.nome}</text>`+
                  `<text class="rcount" x="${cx}" y="${cy+12}">${terr.vini.length}</text>`;
    gNodes.appendChild(lab);
  }
}

function renderCountry(key){
  currentCountry=key; clearMap();
  document.querySelectorAll('.country-btn').forEach(b=>b.classList.toggle('active',b.dataset.k===key));

  const WINE_COUNTRIES=['italy','france','germany','austria','slovenia'];

  if(key==='world'){
    // 1) sagome di contesto (paesi vicini senza vini): solo per orientarsi, neutre e non interattive
    gBg.innerHTML=CTX_LANDS;
    // 2) Italia (regioni: attive colorate + spente)
    renderItalyRegions();
    // 3) paesi esteri con vini (regioni: attive colorate come l'Italia + spente)
    ['france','germany','austria','slovenia'].forEach(c=>renderForeignRegions(c));
    // 4) confini nazionali marcati SOPRA le regioni, per ogni paese-vino
    WINE_COUNTRIES.forEach(c=>drawNationalBorder(c,false));
  } else if(key==='italy'){
    renderItalyRegions(true);
    drawNationalBorder('italy', true);
  } else {
    renderForeignRegions(key, true);
    drawNationalBorder(key, true);
  }

  // conteggi + pannello tipologie del livello corrente
  const inScope = key==='world' ? TERRITORI
    : TERRITORI.filter(t=>t.country===key);
  // livello di riferimento del pannello (a cui si torna quando non si è in hover su una regione)
  panelLevel = {
    name: key==='world' ? 'La carta' : (PAESI[key]?PAESI[key].label:key),
    vini: inScope.flatMap(t=>t.vini),
    terre: inScope.length
  };
  showPanel(panelLevel.name, panelLevel.vini, panelLevel.terre);

  // camera: inquadro il bbox del paese
  fitBBox(PAESI[key].bbox, key==='world');
}

/* ============ PANNELLO TIPOLOGIE (Modello 2: precedenza effervescenza) ============ */
/* Categorie mutuamente esclusive, ogni vino conta una volta sola.
   Precedenza: Champagne > Bollicine > Rosati > Fermi(rosso/bianco/orange). */
const PANEL_CATS=[
  {key:'champagne', label:'Champagne', color:'#c49a3a'},
  {key:'bollicine', label:'Bollicine', color:'#c9a52a'},
  {key:'rose',      label:'Rosati',    color:'#d16690'},
  {key:'rosso',     label:'Rossi fermi',   color:'#c94848'},
  {key:'bianco',    label:'Bianchi fermi', color:'#3aa066'},
  {key:'orange',    label:'Orange',    color:'#d0662a'},
];
function classifyWine(w){
  const tg=(w.tags||[]).map(x=>x.toLowerCase());
  if(tg.some(x=>x.includes('champagne')))return 'champagne';
  if(tg.some(x=>x.includes('spumante')||x.includes('metodo classico')||x.includes('frizzante')||x.includes('lambrusco')))return 'bollicine';
  if(tg.some(x=>x.includes('orange')||x.includes('macerato')))return 'orange';
  if(tg.some(x=>x.includes('rosato')||x.includes('rosé')||x.includes('rose')))return 'rose';
  if(tg.some(x=>x.includes('rosso')||x.includes('nebbiolo')||x.includes('sangiovese')||x.includes('aglianico')||x.includes('primitivo')||x.includes('cannonau')||x.includes('nerello')||x.includes('frappato')||x.includes('lagrein')||x.includes('fumin')||x.includes('montepulciano')||x.includes('appassimento')))return 'rosso';
  return 'bianco';
}
function typeBreakdown(vini){
  const t={}; PANEL_CATS.forEach(c=>t[c.key]=0);
  vini.forEach(w=>{t[classifyWine(w)]++;});
  return t;
}
let panelLevel={name:'La carta', vini:[], terre:0};
const panelName=document.getElementById('panelName');
const panelBars=document.getElementById('panelBars');
const panelMeta=document.getElementById('panelMeta');
function fmtMeta(nv, terre){
  const et=`<b>${nv}</b> ${nv===1?'etichetta':'etichette'}`;
  if(terre==null) return et;   // regione singola: solo etichette
  return `${et} · <b>${terre}</b> ${terre===1?'territorio':'territori'}`;
}
function showPanel(name, vini, terre){
  panelName.textContent=name;
  panelMeta.innerHTML=fmtMeta(vini.length, terre);
  const tot=typeBreakdown(vini);
  const max=Math.max(1,...PANEL_CATS.map(c=>tot[c.key]));
  panelBars.innerHTML=PANEL_CATS.filter(c=>tot[c.key]>0).map(c=>{
    const n=tot[c.key], pct=Math.round(n/max*100);
    return `<div class="pbar">
      <span class="pbar-lab">${c.label}</span>
      <span class="pbar-track"><span class="pbar-fill" style="width:${pct}%;background:${c.color}"></span></span>
      <span class="pbar-val">${n}</span></div>`;
  }).join('') || '<div class="pbar-lab" style="width:auto;opacity:.6">—</div>';
}
/* torna al livello corrente (usato quando l'hover su una regione finisce) */
function resetPanel(){ if(panelLevel) showPanel(panelLevel.name, panelLevel.vini, panelLevel.terre); }

function renderItalyRegions(includeEmpty){
  const active=new Set(TERRITORI.filter(t=>t.country==='italy').map(t=>t.region));
  // spente
  ITALIAN_IDS.filter(id=>!active.has(id)).forEach(id=>{
    const d=REGION_PATHS[id]; if(!d)return;
    drawRegion(d,0,0,null);
  });
  // attive
  TERRITORI.filter(t=>t.country==='italy').forEach(t=>{
    const d=REGION_PATHS[t.region]; if(!d)return;
    const c=REGION_CENTROIDS[t.region]||[500,400];
    drawRegion(d,c[0],c[1],t);
  });
}

function renderForeignRegions(country, solo){
  const C=COUNTRIES[country]; if(!C)return;
  // quali regioni amministrative hanno vini?
  const active={};   // regName -> lista territori
  Object.keys(terrByRegion).filter(k=>k.startsWith(country+'|')).forEach(key=>{
    active[key.split('|')[1]]=terrByRegion[key];
  });
  // 1) regioni SPENTE (senza vini): sfondo neutro non interattivo, esattamente come in Italia
  Object.keys(C.paths).forEach(regName=>{
    if(active[regName])return;
    drawRegion(C.paths[regName],0,0,null);
  });
  // 2) regioni ATTIVE (con vini): colorate per categoria, cliccabili, con etichetta — come l'Italia.
  //    Se una regione amministrativa contiene più territori-vino, li sfalso leggermente in etichetta
  //    ma la regione resta un unico poligono cliccabile sul primo territorio.
  Object.keys(active).forEach(regName=>{
    const list=active[regName];
    const d=C.paths[regName]; if(!d)return;
    const c=C.cent[regName]||[500,400];
    // poligono cliccabile colorato sul territorio "principale" (il primo)
    drawRegion(d, c[0], c[1], list[0]);
    // se ci sono più territori nella stessa regione, aggiungo etichette-nodo per gli altri
    if(list.length>1){
      list.slice(1).forEach((t,i)=>{
        const off=(i+1)*30;
        drawExtraLabel(c[0], c[1]+off, t);
      });
    }
  });
}

/* etichetta aggiuntiva cliccabile per territori multipli nella stessa regione amministrativa estera */
function drawExtraLabel(cx,cy,t){
  const g=document.createElementNS(nsvg,'g');
  g.setAttribute('class','node cat-'+catClass(t)); g.dataset.id=t.id;
  g.setAttribute('transform',`translate(${cx},${cy})`);
  const n=t.vini.length; const r=7;
  g.innerHTML=`
    <circle class="z-halo" r="${r*2.4}"></circle>
    <circle class="z-ring" r="${r+5}"></circle>
    <circle class="z-dot" r="${r}"></circle>
    <text class="z-count" y="${r*0.34}">${n}</text>
    <text class="z-name" x="0" y="${-r-9}">${t.nome}</text>`;
  gNodes.appendChild(g);
}

/* nodo-zona estero: cerchio-luce colorato per categoria, con nome sempre visibile */
function drawZoneNode(cx,cy,t){
  const n=t.vini.length; const r=6+Math.min(n,6)*1.4;
  const g=document.createElementNS(nsvg,'g');
  g.setAttribute('class','node cat-'+catClass(t)); g.dataset.id=t.id;
  g.setAttribute('transform',`translate(${cx},${cy})`);
  g.innerHTML=`
    <circle class="z-halo" r="${r*2.6}"></circle>
    <circle class="z-ring" r="${r+6}"></circle>
    <circle class="z-dot" r="${r}"></circle>
    <text class="z-count" y="${r*0.34}">${n}</text>
    <text class="z-name" x="0" y="${-r-9}">${t.nome}</text>`;
  gNodes.appendChild(g);
}

/* ============ CAMERA ============ */
let vb={x:0,y:0,w:1000,h:760};
let bounds={x:0,y:0,w:1000,h:760};   // limiti pan/zoom del paese corrente
let freeMode=false;
function setVB(){svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);}

let MINW=200, MAXW=1000;
function fitBBox(bb, free){
  freeMode=!!free;
  const [x0,y0,x1,y1]=bb;
  // padding: ampio nel Mondo (respiro), stretto dentro un singolo paese (appena lo spazio per il paese)
  const padFrac = free ? 0.12 : 0.04;
  const padMin  = free ? 20   : 8;
  const pad=Math.max(x1-x0,y1-y0)*padFrac+padMin;
  let w=(x1-x0)+pad*2, h=(y1-y0)+pad*2;
  const ar=1000/760;
  if(w/h>ar) h=w/ar; else w=h*ar;
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  vb={x:cx-w/2,y:cy-h/2,w,h};
  // i bounds definiscono quanto ci si può allontanare/muovere
  if(free){
    bounds={x:-200,y:-200,w:1400,h:1160};
    MAXW=1400;
  } else {
    bounds={x:vb.x, y:vb.y, w:vb.w, h:vb.h};
    MAXW=vb.w;                 // non si può zoomare out oltre l'inquadratura (stretta) del paese
  }
  MINW=Math.max(120, vb.w*0.28);
  animTo(vb, 500);
}

let MINW_UNUSED_MARKER=0;
function clampVB(){
  vb.w=Math.max(MINW,Math.min(MAXW,vb.w)); vb.h=vb.w*760/1000;
  const b=bounds;
  const maxX=b.x+b.w-vb.w, maxY=b.y+b.h-vb.h;
  if(vb.w>=b.w){ vb.x=b.x-(vb.w-b.w)/2; } else { vb.x=Math.max(b.x,Math.min(maxX,vb.x)); }
  if(vb.h>=b.h){ vb.y=b.y-(vb.h-b.h)/2; } else { vb.y=Math.max(b.y,Math.min(maxY,vb.y)); }
}
function animTo(to,ms){
  const from={...vb}; const t0=performance.now();
  (function step(now){
    const k=Math.min(1,(now-t0)/ms), e=1-Math.pow(1-k,3);
    vb={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e};
    setVB(); if(k<1)requestAnimationFrame(step);
  })(performance.now());
}
function clientToMap(cx,cy){const r=svg.getBoundingClientRect();
  return {x:vb.x+(cx-r.left)/r.width*vb.w, y:vb.y+(cy-r.top)/r.height*vb.h};}
function zoomAt(px,py,f){
  const nw=Math.max(MINW,Math.min(MAXW,vb.w*f)); const k=nw/vb.w;
  vb.x=px-(px-vb.x)*k; vb.y=py-(py-vb.y)*k; vb.w=nw; clampVB(); setVB();
}

const mArea=document.getElementById('mArea'),mName=document.getElementById('mName'),

/* ============ HOT (evidenziazione) ============ */
let hotId=null, isTouch=false;
function setHot(id){
  if(id===hotId)return; hotId=id;
  gRegions.querySelectorAll('.region:not(.empty)').forEach(p=>p.classList.toggle('hot',p.dataset.id===id));
  gNodes.querySelectorAll('.label-wrap').forEach(l=>l.classList.toggle('hot',l.dataset.id===id));
  gNodes.querySelectorAll('.node').forEach(nd=>nd.classList.toggle('hot',nd.dataset.id===id));
  if(id){
    const el=gRegions.querySelector(`.region[data-id="${id}"]`); if(el)gRegions.appendChild(el);
    const lab=gNodes.querySelector(`.label-wrap[data-id="${id}"]`)||gNodes.querySelector(`.node[data-id="${id}"]`);
    if(lab)gNodes.appendChild(lab);
  }
  // confine nazionale: passando su una regione evidenzio il confine del suo paese
  const t=id?byId[id]:null;
  gBorders.querySelectorAll('.natline').forEach(nl=>nl.classList.toggle('hot', !!t && nl.dataset.country===t.country));
  // pannello: su hover/drag di una regione mostro il breakdown di QUELLA regione, altrimenti torno al livello
  if(t) showPanel(t.nome, t.vini);
  else resetPanel();
}
function clearHot(){setHot(null);}
function territoryAt(cx,cy){
  const el=document.elementFromPoint(cx,cy); if(!el)return null;
  const hit=el.closest('.region:not(.empty), .node'); return hit?hit.dataset.id:null;
}

/* ============ DESKTOP: hover, click, drag-pan, wheel-zoom ============ */
let panning=null;   // {sx,sy, ox,oy}
gRegions.addEventListener('pointerover',e=>{if(isTouch||panning)return;const el=e.target.closest('.region:not(.empty)');if(el)setHot(el.dataset.id);});
gRegions.addEventListener('pointerout',e=>{if(isTouch)return;const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.region:not(.empty)');if(!to)clearHot();});
gNodes.addEventListener('pointerover',e=>{if(isTouch||panning)return;const el=e.target.closest('.node');if(el)setHot(el.dataset.id);});
gNodes.addEventListener('pointerout',e=>{if(isTouch)return;const to=e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('.node');if(!to)clearHot();});

svg.addEventListener('pointerdown',e=>{
  if(e.pointerType==='touch')return;   // desktop only qui
  panning={sx:e.clientX,sy:e.clientY,ox:vb.x,oy:vb.y,moved:false};
  svg.classList.add('grabbing'); svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'||!panning)return;
  const r=svg.getBoundingClientRect();
  const dx=(e.clientX-panning.sx)/r.width*vb.w, dy=(e.clientY-panning.sy)/r.height*vb.h;
  if(Math.abs(e.clientX-panning.sx)+Math.abs(e.clientY-panning.sy)>4) panning.moved=true;
  vb.x=panning.ox-dx; vb.y=panning.oy-dy; clampVB(); setVB();
});
svg.addEventListener('pointerup',e=>{
  if(e.pointerType==='touch')return;
  svg.classList.remove('grabbing');
  const wasMoved=panning&&panning.moved; panning=null;
  if(!wasMoved){ const id=territoryAt(e.clientX,e.clientY); if(id)openModal(id); }
});
svg.addEventListener('wheel',e=>{
  e.preventDefault();
  const m=clientToMap(e.clientX,e.clientY);
  zoomAt(m.x,m.y, e.deltaY>0?1.06:0.945);   // zoom più dolce
},{passive:false});

/* ============ TOUCH: 1 dito su terra=striscia · 1 dito su mare=pan · 2 dita=pinch ============ */
const pts=new Map(); let pinch=null, touchPan=null, touchMoved=false, touchStartId=null;
const D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), M=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
svg.addEventListener('pointerdown',e=>{
  if(e.pointerType!=='touch')return;
  isTouch=true; svg.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    touchMoved=false;
    const id=territoryAt(e.clientX,e.clientY);
    touchStartId=id;
    if(id){ setHot(id); touchPan=null; }
    else { touchPan={sx:e.clientX,sy:e.clientY,ox:vb.x,oy:vb.y}; }  // dito sul mare -> pan
  } else if(pts.size===2){
    const [a,b]=[...pts.values()]; pinch={dist:D(a,b),mid:M(a,b)}; touchPan=null; touchMoved=true;
  }
},true);
svg.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'||!pts.has(e.pointerId))return;
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size>=2&&pinch){
    const [a,b]=[...pts.values()]; const nd=D(a,b),nm=M(a,b);
    const mp=clientToMap(nm.x,nm.y); zoomAt(mp.x,mp.y,pinch.dist/nd);
    const r=svg.getBoundingClientRect();
    vb.x-=(nm.x-pinch.mid.x)/r.width*vb.w; vb.y-=(nm.y-pinch.mid.y)/r.height*vb.h;
    clampVB(); setVB(); pinch.dist=nd; pinch.mid=nm; return;
  }
  if(touchPan){
    const r=svg.getBoundingClientRect();
    vb.x=touchPan.ox-(e.clientX-touchPan.sx)/r.width*vb.w;
    vb.y=touchPan.oy-(e.clientY-touchPan.sy)/r.height*vb.h;
    clampVB(); setVB(); return;
  }
  // strisciamento su terra
  touchMoved=true; const id=territoryAt(e.clientX,e.clientY); if(id)setHot(id);
},true);
svg.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch')return;
  const wasMulti=pts.size>=2;
  pts.delete(e.pointerId); if(pts.size<2)pinch=null;
  if(pts.size===0){
    if(touchPan){ touchPan=null; return; }
    if(!wasMulti){
      const id=territoryAt(e.clientX,e.clientY);
      if(id&&id===hotId&&(!touchMoved||id===touchStartId)) openModal(id);
      else if(id) setHot(id);
    }
  }
},true);
svg.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=null;touchPan=null;},true);

/* =========================================================================
   COLLEGAMENTO ALLA CARTA REALE (Supabase carta_vini)
   Ricostruisce TERRITORI dai vini veri, raggruppati per regione e collocati
   sulla geografia della mappa (regioni italiane + regioni amministrative di
   Francia/Germania/Austria/Slovenia). Nessun vino è hardcoded: i TERRITORI
   demo restano solo come ripiego se il database è irraggiungibile.
   ========================================================================= */
const SUPABASE_URL='https://demo.invalid';
const SUPABASE_KEY='demo-anon-key';
async function sbRows(){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/carta_vini?select=*&archiviato=is.false&order=producer,name`,
    {headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const rows=await res.json();
  if(!Array.isArray(rows)||!rows.length) throw new Error('carta_vini vuota');
  return rows;
}
const _low=s=>(s==null?'':String(s)).toLowerCase();
const _list=v=>Array.isArray(v)?v.filter(x=>x!=null&&String(x).trim()!=='')
  :(typeof v==='string'&&v.trim()?v.split(/[,;]/).map(s=>s.trim()).filter(Boolean):[]);
const _norm=s=>_low(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();

function isBubbly(r){
  if(['bollicine','champagne'].includes(_low(r.cat)))return true;
  const hay=[r.tipo,r.denom,r.classe,r.sub,r.name].map(_low).join(' | ')+' | '+_list(r.carat).map(_low).join(' ');
  return /spumante|metodo classico|ancestrale|col fondo|pet.?nat|p[eé]tillant|frizzante|lambrusco|prosecco|franciacorta|champagne|trento|blanc de|sui lieviti|rifermentat|sat[eè]n|cap classique|mousseux|\bvsq\b/.test(hay);
}
function isChampagne(r){
  return _low(r.cat)==='champagne' || /champagne/.test([r.denom,r.region,r.name].map(_low).join(' '));
}
function isOrange(r){
  const hay=[r.tipo,r.denom,r.classe,r.name].map(_low).join(' | ')+' | '+_list(r.carat).map(_low).join(' ')+' | '+_list(r.descr_tags).map(_low).join(' ');
  return /macerat|orange|ramato|sulle bucce|skin contact/.test(hay);
}
function isRosato(r){
  if(_low(r.cat)==='rose')return true;
  const hay=[r.tipo,r.denom,r.classe,r.name,r.sub].map(_low).join(' | ');
  return /\brosato\b|\bros[eé]\b|cerasuolo|rosa dei|rosa di|de saignee|saign[eé]e|\brosa\b/.test(hay);
}
function coloreOf(r,bub){
  if(isOrange(r))return 'orange';
  if(isRosato(r))return 'rosato';
  const hay=[r.tipo,r.denom,r.classe,r.name,r.cat].map(_low).join(' | ');
  const explicitRed=/\brosso\b|\brossi\b|\bred\b|\btinto\b/.test(hay);
  if(bub) return explicitRed?'rosso':'bianco';
  if(explicitRed) return 'rosso';
  const uv=_list(r.uvaggio).map(_low).join(' ');
  if(/nebbiolo|sangiovese|aglianico|nero d.?avola|barbera|dolcetto|montepulciano|primitivo|negroamaro|merlot|cabernet|syrah|lagrein|nerello|frappato|cannonau|corvina|sagrantino|teroldego|refosco|fumin|pinot nero/.test(uv)
     && !/blanc de blancs|blanc de noirs|bianco|spumante/.test(hay)) return 'rosso';
  return 'bianco';
}
/* tag mostrati nella scheda e usati da catClass/classifyWine per il colore */
function wineTags(r){
  const bub=isBubbly(r), col=coloreOf(r,bub);
  const t=[];
  if(isChampagne(r)) t.push('Champagne');
  if(bub) t.push('Spumante');
  if(col==='orange') t.push('Orange');
  else if(col==='rosato') t.push('Rosato');
  else if(col==='rosso') t.push('Rosso');
  else t.push('Bianco');
  _list(r.uvaggio).filter(u=>!/__piwi__/i.test(u)).slice(0,3).forEach(u=>{ if(!t.includes(u)) t.push(u); });
  _list(r.carat).forEach(c=>{ if(/bio|biodinam|triple a|anfora|metodo classico|riserva|dosaggio|brut nature|col fondo|ancestrale|pet.?nat/i.test(c) && !t.includes(c)) t.push(c); });
  return t;
}

/* --- geografia: dalla regione del vino alla geometria della mappa --- */
const IT_REGIONS={'emilia romagna':'emilia','emilia':'emilia','sicilia':'sicilia','marche':'marche',
  'toscana':'toscana','trentino alto adige':'trentino','trentino':'trentino','alto adige':'trentino',
  'lombardia':'lombardia','veneto':'veneto','valle d aosta':'valaosta','val d aosta':'valaosta',
  'piemonte':'piemonte','puglia':'puglia','basilicata':'basilicata','friuli venezia giulia':'friuli',
  'friuli':'friuli','liguria':'liguria','abruzzo':'abruzzo','campania':'campania','sardegna':'sardegna',
  'umbria':'umbria','lazio':'lazio','molise':'molise','calabria':'calabria'};
const IT_NOME={emilia:'Emilia-Romagna',sicilia:'Sicilia',marche:'Marche',toscana:'Toscana',
  trentino:'Trentino Alto-Adige',lombardia:'Lombardia',veneto:'Veneto',valaosta:"Valle d'Aosta",
  piemonte:'Piemonte',puglia:'Puglia',basilicata:'Basilicata',friuli:'Friuli Venezia-Giulia',
  liguria:'Liguria',abruzzo:'Abruzzo',campania:'Campania',sardegna:'Sardegna',umbria:'Umbria',
  lazio:'Lazio',molise:'Molise',calabria:'Calabria'};
function italianId(r){
  const reg=_norm(r.region);
  if(reg.includes('franciacorta')) return 'lombardia';   // Franciacorta = Lombardia
  if(/francia|france|germania|austria|slovenia|africa|spagna/.test(reg)) return null;
  for(const k in IT_REGIONS){ if(reg.includes(k)) return IT_REGIONS[k]; }
  return null;
}
/* mappa un vino estero a (paese, regione amministrativa nota alla mappa).
   Uso regione + denominazione + nome insieme, perché spesso la regione è
   generica ("Francia") e il territorio vero sta nella denominazione ("Chablis"). */
function foreignInfo(r){
  const hay=_norm([r.region,r.denom,r.name].join(' '));
  const has=(...w)=>w.some(x=>hay.includes(x));
  // Francia
  if(has('champagne')) return {country:'france',adminRegion:'Grand Est',nome:'Champagne'};
  if(has('alsazia','alsace')) return {country:'france',adminRegion:'Grand Est',nome:'Alsazia'};
  if(has('borgogna','bourgogne','chablis')) return {country:'france',adminRegion:'Bourgogne-Franche-Comté',nome:'Borgogna'};
  if(has('roannaise')) return {country:'france',adminRegion:'Auvergne-Rhône-Alpes',nome:'Côte Roannaise'};
  if(has('savoia','savoie')) return {country:'france',adminRegion:'Auvergne-Rhône-Alpes',nome:'Savoia'};
  if(has('muscadet','vouvray','pouilly','sancerre','chinon','saumur','loira','loire')) return {country:'france',adminRegion:'Centre-Val de Loire',nome:'Loira'};
  if(has('languedoc','roussillon')) return {country:'france',adminRegion:'Occitanie',nome:'Languedoc-Roussillon'};
  if(has('provenza','provence')) return {country:'france',adminRegion:"Provence-Alpes-Côte-d'Azur",nome:'Provenza'};
  // Germania
  if(has('germania','germany','deutschland','mosel','mosella','nahe','pfalz','palatinato','franken','franconia','rheingau','baden','saar')){
    if(has('franken','franconia')) return {country:'germany',adminRegion:'Bayern',nome:'Franconia'};
    if(has('rheingau','hessen')) return {country:'germany',adminRegion:'Hessen',nome:'Rheingau'};
    if(has('baden')) return {country:'germany',adminRegion:'Baden-Württemberg',nome:'Baden'};
    if(has('nahe')) return {country:'germany',adminRegion:'Rheinland-Pfalz',nome:'Nahe'};
    if(has('pfalz','palatinato')) return {country:'germany',adminRegion:'Rheinland-Pfalz',nome:'Pfalz'};
    return {country:'germany',adminRegion:'Rheinland-Pfalz',nome:'Mosella'};
  }
  // Austria
  if(has('austria','osterreich','kamptal','wachau','wagram','kremstal','burgenland')){
    if(has('kamptal')) return {country:'austria',adminRegion:'Niederösterreich',nome:'Kamptal'};
    if(has('wagram')) return {country:'austria',adminRegion:'Niederösterreich',nome:'Wagram'};
    if(has('wachau')) return {country:'austria',adminRegion:'Niederösterreich',nome:'Wachau'};
    return {country:'austria',adminRegion:'Niederösterreich',nome:'Austria'};
  }
  // Slovenia
  if(has('slovenia','slovenija','brda','vipava','bizeljsko','posavje','kras','carso','stajerska')){
    if(has('bizeljsko','posavje')) return {country:'slovenia',adminRegion:'Spodnjeposavska',nome:'Posavje'};
    if(has('kras','carso')) return {country:'slovenia',adminRegion:'Notranjsko-kraška',nome:'Carso'};
    return {country:'slovenia',adminRegion:'Goriška',nome:'Goriška Brda'};
  }
  // Francia generica (nessun sotto-territorio riconosciuto)
  if(has('francia','france')) return {country:'france',adminRegion:'Grand Est',nome:'Francia'};
  return null; // fuori dalla mappa (es. Sud Africa): non collocabile
}
function rowToWine(r){
  return {name:r.name||'', prod:r.producer||'', price:(r.price!=null&&r.price!==''?Number(r.price):null), tags:wineTags(r)};
}
const AREA_LABEL={france:'Francia',germany:'Germania',austria:'Austria',slovenia:'Slovenia'};
function buildTerritori(rows){
  const itMap={}, forMap={}, skipped=[];
  for(const r of rows){
    if(!r||!r.name) continue;
    const w=rowToWine(r);
    const itId=italianId(r);
    if(itId){
      (itMap[itId]=itMap[itId]||{id:itId,nome:IT_NOME[itId]||itId,area:'Italia',country:'italy',region:itId,vini:[]}).vini.push(w);
    } else {
      const fi=foreignInfo(r);
      if(!fi){ skipped.push(w.name); continue; }
      // UNA sola regione per regione amministrativa: niente più nodi/simboli
      // doppi quando più zone-vino cadono nella stessa regione (es. Champagne +
      // Alsazia in Grand Est). L'etichetta unisce i nomi delle zone presenti.
      const key=fi.country+'|'+fi.adminRegion;
      let terr=forMap[key];
      if(!terr){
        terr=forMap[key]={ id:'f_'+_norm(fi.country+' '+fi.adminRegion).replace(/ /g,'_'),
          _nomi:new Set(), nome:'', area:AREA_LABEL[fi.country]||fi.country,
          country:fi.country, region:fi.adminRegion, vini:[] };
      }
      terr._nomi.add(fi.nome);
      terr.vini.push(w);
    }
  }
  // etichetta di ogni territorio estero = nomi delle zone-vino che contiene
  Object.values(forMap).forEach(t=>{ t.nome=[...t._nomi].join(' · '); delete t._nomi; });
  if(skipped.length) console.warn('mappa: '+skipped.length+' vini fuori dalla mappa (es. extra-Europa):', skipped.join(', '));
  return [...Object.values(itMap), ...Object.values(forMap)];
}
/* ricostruisce gli indici derivati da TERRITORI (byId, totVini, terrByRegion) */
function rebuildIndexes(){
  Object.keys(byId).forEach(k=>delete byId[k]);
  Object.keys(terrByRegion).forEach(k=>delete terrByRegion[k]);
  totVini=0;
  TERRITORI.forEach(t=>{ totVini+=t.vini.length; byId[t.id]=t; });
  TERRITORI.filter(t=>t.country!=='italy').forEach(t=>{
    const key=t.country+'|'+t.region;
    (terrByRegion[key]=terrByRegion[key]||[]).push(t);
  });
}

/* avvio: prova il DB, poi disegna il Mondo */
// Nome del LOCALE (configurabile da Index → Personalizza carta, tabella
// carta_settings). "Cantera" è il nome del prodotto; qui si mostra solo il locale.
async function applyLocaleBranding(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/carta_settings?select=cover_pre,cover_name`, {headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY}});
    const rows = await res.json();
    const r = (Array.isArray(rows) && rows[0]) ? rows[0] : {};
    const name = ((r.cover_name||'')+'').trim() || 'Osteria del Melograno';
    const eb = document.querySelector('.eyebrow');
    if (eb) eb.textContent = name;
    document.title = name + ' — La carta per territori';
  }catch(e){}
}
(async function boot(){
  applyLocaleBranding();
  try{
    const rows=await sbRows();
    const T=buildTerritori(rows);
    if(T.length){ TERRITORI=T; rebuildIndexes(); console.log('mappa: carta_vini da Supabase →', totVini, 'vini in', TERRITORI.length, 'territori'); }
    else throw new Error('nessun territorio');
  }catch(e){
    console.warn('mappa: database non disponibile, uso i dati demo:', e.message);
  }
  renderCountry('world');
})();

(function(){
  var embedded = window.parent && window.parent !== window;
