<script id="demo-data-shim">
/* DEMO — serve la stessa carta finta (carta-demo.json) al posto di Supabase,
   cosi' Scopri/Mappa/Scelte mostrano gli STESSI vini della Carta. */
(function(){
  var _fetch = window.fetch ? window.fetch.bind(window) : null;
  var _cache = null;
  function resp(data){ return { ok:true, status:200,
    json:function(){ return Promise.resolve(data); },
    text:function(){ return Promise.resolve(JSON.stringify(data)); },
    headers:{ get:function(){ return null; } } }; }
  function load(){
    if(_cache) return Promise.resolve(_cache);
    return _fetch('carta-demo.json').then(function(r){ return r.json(); })
      .then(function(d){ _cache = d || {}; return _cache; })
      .catch(function(){ _cache = {}; return _cache; });
  }
  window.fetch = function(input, init){
    var url = (typeof input === 'string') ? input : (input && input.url) || '';
    if(url.indexOf('/rest/v1/carta_vini') >= 0)     return load().then(function(d){ return resp(d.carta_vini || []); });
    if(url.indexOf('/rest/v1/carta_settings') >= 0) return load().then(function(d){ return resp(d.carta_settings || []); });
    if(url.indexOf('demo.invalid') >= 0 || url.indexOf('/rest/v1/') >= 0) return Promise.resolve(resp([]));
    return _fetch ? _fetch(input, init) : Promise.reject(new Error('offline'));
  };
})();
</script>

<script>
/* ============================================================
   SCELTE RAPIDE — v2 COLLEGATA AL DATABASE.
   Nessun vino è scritto nel codice: tutto viene da carta_vini
   (Supabase). La composizione degli slot si configura da Index
   tramite la chiave `scelte_config` della tabella `impostazioni`;
   se la chiave non esiste ancora, ogni slot sceglie da solo un
   vino reale con una regola automatica. Il vino proposto è
   stabile per tutta la giornata e ruota il giorno dopo.
   ============================================================ */
const SUPABASE_URL='https://demo.invalid';
const SUPABASE_KEY='demo-anon-key';
async function sbGet(path){
  const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,
    {headers:{apikey:SUPABASE_KEY, Authorization:'Bearer '+SUPABASE_KEY}});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

/* ---- vocabolario descrittori (stesso dello Scopri) ---- */
const VOCAB=[{"famiglia":"Aromi (naso)","tag":[{"id":"agrumato","emoji":"🍋"},{"id":"fruttato","emoji":"🍏"},{"id":"esotico","emoji":"🍍"},{"id":"floreale","emoji":"🌸"},{"id":"aromatico","emoji":"💐"},{"id":"erbe_aromatiche","emoji":"🌿"},{"id":"speziato","emoji":"🌶️"},{"id":"mandorlato","emoji":"🥜"},{"id":"frutta_rossa","emoji":"🍒"},{"id":"crosta_di_pane","emoji":"🍞"},{"id":"evoluto","emoji":"🍯"}]},
{"famiglia":"Corpo","tag":[{"id":"leggero","emoji":"🪶"},{"id":"strutturato","emoji":"🍷"}]},
{"famiglia":"Carattere in bocca","tag":[{"id":"fresco","emoji":"💧"},{"id":"teso","emoji":"⚡"},{"id":"vivace","emoji":"✨"},{"id":"morbido","emoji":"☁️"}]},
{"famiglia":"Sapidita' / mineralita'","tag":[{"id":"sapido","emoji":"🧂"},{"id":"minerale","emoji":"🪨"},{"id":"salmastro","emoji":"🌊"}]},
{"famiglia":"Stile","tag":[{"id":"bollicine_fini","emoji":"🥂"},{"id":"bollicine_fresche","emoji":"🫧"},{"id":"velato","emoji":"🌫️"},{"id":"macerato","emoji":"🟠"},{"id":"rosato","emoji":"🌷"},{"id":"cerasuolo","emoji":"🌹"},{"id":"cremoso","emoji":"🥛"}]},
{"famiglia":"Tannino","tag":[{"id":"lieve_tannino","emoji":"🍇"},{"id":"tannico","emoji":"🍇"}]},
{"famiglia":"Dolcezza (solo eccezione)","tag":[{"id":"abboccato","emoji":"🍬"},{"id":"dolce","emoji":"🍬"}]}];
const TAGMAP={}; VOCAB.forEach(f=>f.tag.forEach(t=>TAGMAP[t.id]=t));

/* ---- helper e classificatori (identici allo Scopri) ---- */
const _low=s=>{const t=(s==null?'':String(s)).toLowerCase();return t==='null'?'':t;};
const _list=v=>Array.isArray(v)?v.filter(x=>x!=null&&String(x).trim()!==''&&String(x).trim().toLowerCase()!=='null')
  :(typeof v==='string'&&v.trim()?v.split(/[,;]/).map(s=>s.trim()).filter(Boolean):[]);
const _norm=s=>_low(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const wineKey=r=>(r.producer||'')+'|||'+(r.name||'');
function isBubbly(r){
  if(['bollicine','champagne'].includes(_low(r.cat)))return true;
  const hay=[r.tipo,r.denom,r.classe,r.sub,r.name].map(_low).join(' | ')+' | '+_list(r.carat).map(_low).join(' ');
  return /spumante|metodo classico|ancestrale|col fondo|pet.?nat|p[eé]tillant|frizzante|lambrusco|prosecco|franciacorta|champagne|trento|blanc de|sui lieviti|rifermentat|sat[eè]n|cap classique|mousseux|\bvsq\b/.test(hay);
}
function isChampagne(r){
  return _low(r.cat)==='champagne' || /champagne/.test([r.denom,r.region,r.sub,r.name].map(_low).join(' '));
}
function isOrange(r){
  const hay=[r.tipo,r.denom,r.classe,r.name].map(_low).join(' | ')+' | '+_list(r.carat).map(_low).join(' ')+' | '+_list(r.descr_tags).map(_low).join(' ');
  return /macerat|orange|ramato|sulle bucce|skin contact/.test(hay);
}
function isRosato(r){
  if(_low(r.cat)==='rose')return true;
  const hay=[r.tipo,r.denom,r.classe,r.name,r.sub].map(_low).join(' | ');
  return /\brosato\b|\bros[eé]\b|cerasuolo|rosa dei|rosa di|de saignee|saign[eé]e|\brosa\b/.test(hay);
}
function coloreOf(r,bub){
  if(isOrange(r))return 'orange';
  if(isRosato(r))return 'rosato';
  const hay=[r.tipo,r.denom,r.classe,r.name,r.cat].map(_low).join(' | ');
  const explicitRed=/\brosso\b|\brossi\b|\bred\b|\btinto\b/.test(hay);
  if(bub) return explicitRed?'rosso':'bianco';
  if(explicitRed) return 'rosso';
  const uv=_list(r.uvaggio).map(_low).join(' ');
  if(/nebbiolo|sangiovese|aglianico|nero d.?avola|barbera|dolcetto|montepulciano|primitivo|negroamaro|merlot|cabernet|syrah|lagrein|nerello|frappato|cannonau|corvina|sagrantino|teroldego|refosco|fumin|pinot nero/.test(uv)
     && !/blanc de blancs|blanc de noirs|bianco|spumante/.test(hay)) return 'rosso';
  return 'bianco';
}
const IT_REG=['valaosta','valle d aosta','piemonte','liguria','lombardia','trentino','trentino alto adige','alto adige','sudtirol','veneto','friuli','friuli venezia giulia','emilia','emilia romagna','toscana','umbria','marche','lazio','abruzzo','molise','campania','puglia','basilicata','calabria','sicilia','sardegna','franciacorta','italia'];
const ESTERO_HINTS=/champagne|francia|france|germania|deutsch|mosel|austria|osterreich|slovenia|spagna|espan|portogallo|portugal|sud africa|south africa|georgia|grecia|greece|ungheria|nuova zelanda|new zealand|australia|cile|chile|argentina|california|oregon|libano|inghilterra|england/;
function isEstero(r){
  if(['stranieri','champagne'].includes(_low(r.cat))) return true;
  if(ESTERO_HINTS.test(_norm(r.sub)+' '+_norm(r.denom))) return true;
  const reg=_norm(r.region);
  if(reg==='') return false;
  return !IT_REG.some(k=>reg.includes(k));
}
function isArtigianale(r){
  const hay=_list(r.carat).map(_low).join(' ')+' '+_low(r.denom)+' '+_low(r.tipo);
  return isOrange(r) || /\bbio\b|biodinam|triple a|naturale|natural|anfora|macerat|col fondo|ancestrale|pet.?nat|sui lieviti|rifermentat/.test(hay);
}
function sensOf(r){
  const known=_list(r.descr_tags).map(id=>_low(id).replace(/\s+/g,'_')).filter(id=>TAGMAP[id]);
  if(known.length) return known;
  const bub=isBubbly(r), col=coloreOf(r,bub), s=new Set();
  if(bub){
    const hay=_low(r.denom)+' '+_list(r.carat).map(_low).join(' ')+' '+_low(r.name);
    if(/metodo classico|champagne|franciacorta|trento|blanc de|dosaggio|pas dos|extra brut|brut nature|riserva|sat[eè]n|alta langa/.test(hay)){
      s.add('crosta_di_pane');s.add('bollicine_fini');s.add('teso');
    } else { s.add('bollicine_fresche');s.add('vivace');s.add('fresco'); }
  }
  if(col==='orange'){s.add('macerato');s.add('lieve_tannino');s.add('sapido');}
  else if(col==='rosato'){s.add('frutta_rossa');s.add('floreale');s.add('fresco');}
  else if(col==='rosso'){s.add('frutta_rossa');s.add('strutturato');s.add('speziato');}
  else if(!bub){s.add('agrumato');s.add('floreale');s.add('fresco');s.add('minerale');}
  if(!s.size){s.add('fresco');s.add('fruttato');}
  return [...s];
}

/* ---- estrazione casuale STABILE per la giornata ----
   Il seme cambia solo col giorno (e con lo slot): stesso vino tutto
   il giorno per tutti i clienti, uno diverso domani. */
function dailyRand(slotId){
  const day=new Date().toISOString().slice(0,10);
  let h=2166136261, str=day+'|'+slotId;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  h>>>=0;
  return function(){ h=Math.imul(h^(h>>>15),2246822507); h=Math.imul(h^(h>>>13),3266489909); h=(h^(h>>>16))>>>0; return h/4294967296; };
}
function dailyPick(arr,slotId){
  if(!arr.length) return null;
  return arr[Math.floor(dailyRand(slotId)()*arr.length)];
}

/* ---- SLOT: definizioni (solo regole ed etichette, MAI vini) ----
   Ogni regola filtra carta_vini reale. `scelte_config` da Index può
   rinominare, disattivare o forzare un vino preciso per ogni slot. */
const SLOT_DEFS=[
  {id:'amato',        emoji:'🔥', label:'Il più amato',    tagline:'Quello che ordinano tutti',
   rule:rows=>rows.filter(r=>r.price!=null&&r.price>0&&r.price<=55)},
  {id:'bollicine',    emoji:'🫧', label:'Le bollicine',    tagline:'Per far festa',
   rule:rows=>{const it=rows.filter(r=>isBubbly(r)&&!isChampagne(r)&&!isEstero(r)); return it.length?it:rows.filter(isBubbly);}},
  {id:'rosa_ambra',   emoji:'🌅', label:'Rosa & Ambra',    tagline:'Rosati e orange, fuori dagli schemi',
   rule:rows=>rows.filter(r=>isOrange(r)||isRosato(r))},
  {id:'aperitivo',    emoji:'🍸', label:"Per l'aperitivo", tagline:'Un calice per aprire la sera',
   rule:rows=>rows.filter(r=>r.price!=null&&r.price>0&&r.price<=32&&coloreOf(r,isBubbly(r))!=='rosso')},
  {id:'oltreconfine', emoji:'🌍', label:'Oltreconfine',    tagline:"Un salto fuori dall'Italia",
   rule:rows=>rows.filter(isEstero)},
  {id:'genuino',      emoji:'🌿', label:'Genuino',         tagline:'Da vignaioli e vini naturali',
   rule:rows=>rows.filter(isArtigianale)},
  {id:'sorprendimi',  emoji:'🎲', label:'Sorprendimi',     tagline:'Ci pensiamo noi — ti fidi?',
   rule:rows=>rows},
  {id:'perla',        emoji:'💎', label:'La perla',        tagline:'Una bottiglia da ricordare',
   rule:rows=>{const p=rows.filter(r=>r.price!=null).sort((a,b)=>b.price-a.price); return p.slice(0,Math.max(5,Math.ceil(p.length*0.1)));}},
];

/* ---- config da Index (impostazioni.scelte_config) ---- */
async function loadConfig(){
  try{
    const rows=await sbGet('impostazioni?key=eq.scelte_config&select=value');
    if(Array.isArray(rows)&&rows.length&&rows[0].value){
      const v=typeof rows[0].value==='string'?JSON.parse(rows[0].value):rows[0].value;
      if(v&&Array.isArray(v.slots)) return v;
    }
  }catch(e){ console.warn('scelte: config non leggibile, uso regole automatiche:', e.message); }
  return null;   // nessuna config → tutti gli slot in automatico
}

/* ---- risoluzione slot → vino reale ---- */
function resolveSlots(rows,cfg){
  const byKey={}; rows.forEach(r=>{ byKey[wineKey(r)]=r; });
  const cfgById={}; if(cfg) cfg.slots.forEach(s=>{ if(s&&s.id) cfgById[s.id]=s; });
  const out=[];
  SLOT_DEFS.forEach(def=>{
    const c=cfgById[def.id]||{};
    if(c.enabled===false) return;
    let wine=null;
    if(c.mode==='manual'&&c.wineKey){
      wine=byKey[c.wineKey]||null;
      if(!wine) console.warn('scelte: vino configurato non trovato in carta_vini:', c.wineKey);
    }
    if(!wine){
      const pool=def.rule(rows);
      wine=dailyPick(pool,def.id);
    }
    if(!wine) return;   // regola senza risultati e nessuna scelta manuale: slot nascosto
    out.push({
      id:def.id,
      emoji:c.emoji||def.emoji,
      label:c.label||def.label,
      tagline:c.tagline||def.tagline,
      wine
    });
  });
  return out;
}

/* ---- costruzione UI (stessa stella della v1, ma dati reali) ---- */
const HOVER = window.matchMedia && window.matchMedia('(hover:hover) and (pointer:fine)').matches;
const stage = document.getElementById('stage');
const sub = document.getElementById('sub');
let items = [];

function setMsg(txt){
  let m=document.getElementById('stageMsg');
  if(!txt){ if(m) m.remove(); return; }
  if(!m){ m=document.createElement('div'); m.id='stageMsg'; m.className='stage-msg'; stage.appendChild(m); }
  m.textContent=txt;
}

function buildStage(picks){
  items.forEach(it=>it.remove()); items=[];
  picks.forEach((p)=>{
    const it=document.createElement('div'); it.className='item';
    it.innerHTML=`<button class="qp" aria-label="${p.label}">${p.emoji}</button>`+
                 `<div class="lab">${p.label}<span class="hint">tocca ancora per aprire</span></div>`;
    stage.appendChild(it); items.push(it);
    const onActivate=()=>{
      if(HOVER){ openSheet(p); return; }
      if(it.classList.contains('on')){ openSheet(p); }
      else { items.forEach(x=>x.classList.remove('on')); it.classList.add('on'); }
    };
    it.querySelector('.qp').addEventListener('click', onActivate);
  });
  if(HOVER){ document.querySelectorAll('.hint').forEach(h=>h.style.display='none'); sub.textContent='Passa sopra un simbolo per scoprire cosa ti proponiamo'; }
  layout();
  setTimeout(layout, 200);
}

/* tap sullo sfondo: chiude l'etichetta aperta (mobile) */
stage.addEventListener('click', e=>{ if(e.target===stage) items.forEach(x=>x.classList.remove('on')); });

function layout(){
  if(!items.length) return;
  const w=stage.clientWidth, h=stage.clientHeight||420;
  const bs=(items[0]&&items[0].querySelector('.qp').offsetWidth)||70;
  const r=bs/2, m=10;
  const Rx=Math.max(58, w/2 - r - m);
  const Ry=Math.max(58, Math.min(h/2 - r - m, Rx*1.55));
  const cx=w/2, cy=h/2;
  items.forEach((it,i)=>{
    const a=-Math.PI/2 + i/items.length*2*Math.PI;
    it.style.left=(cx+Rx*Math.cos(a))+'px';
    it.style.top=(cy+Ry*Math.sin(a))+'px';
    it.style.transform='translate(-50%,-50%)';
    it.classList.toggle('up', Math.sin(a) > 0.35);
  });
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', ()=>setTimeout(layout,150));

/* ---- scheda vino (dati reali dalla carta) ---- */
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const modalBack=document.getElementById('modalBack'), sheet=document.getElementById('sheet');
function openSheet(p){
  const w=p.wine;
  const den=[w.denom,(w.region&&w.region!==w.denom?w.region:'')].filter(Boolean).join(' · ');
  const anno=(w.anno!=null&&String(w.anno).trim()!=='')?String(w.anno):'';
  const carat=_list(w.carat);
  const sens=sensOf(w).map(id=>TAGMAP[id]?TAGMAP[id].emoji:'').filter(Boolean).slice(0,5);
  const descr=(w.descr_frase&&String(w.descr_frase).trim())?String(w.descr_frase).trim():'';
  const price=(w.price!=null&&w.price!=='')?Number(w.price):null;
  sheet.innerHTML=
    `<div class="s-reason"><span class="rg">${esc(p.emoji)}</span> ${esc(p.label)}</div>`+
    `<div class="s-tag">${esc(p.tagline)}</div>`+
    `<div class="s-head"><div><div class="s-prod">${esc(w.producer)}</div><div class="s-name">${esc(w.name)}${anno?` <span style="font-size:16px;color:var(--paper-dim)">${esc(anno)}</span>`:''}</div>`+
      `${den?`<div class="s-den">${esc(den)}</div>`:''}</div>${price!=null?`<div class="s-price">${price} €</div>`:''}</div>`+
    `${carat.length?`<div class="s-carat">${carat.map(c=>`<span class="c">${esc(c)}</span>`).join('')}</div>`:''}`+
    `${sens.length?`<div class="s-sens">${sens.map(e=>`<span>${e}</span>`).join('')}</div>`:''}`+
    `${descr?`<div class="s-read">${esc(descr)}</div>`:''}`+
    `<button class="s-close" id="sClose">Chiudi</button>`;
  modalBack.classList.add('open');
  document.getElementById('sClose').addEventListener('click', closeSheet);
  items.forEach(x=>x.classList.remove('on'));
}
function closeSheet(){ modalBack.classList.remove('open'); }
modalBack.addEventListener('click', e=>{ if(e.target===modalBack) closeSheet(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

/* ---- tema (light di default, come v1) ---- */
const themeBtn=document.getElementById('themeToggle');
themeBtn.addEventListener('click', ()=>{ const light=document.body.classList.toggle('light'); themeBtn.textContent=light?'☀️':'🌙'; });

/* ---- bootstrap: SOLO dati reali, niente ripieghi finti ---- */
// Nome del LOCALE (configurabile da Index → Personalizza carta, tabella
// carta_settings). "Cantera" è il nome del prodotto; qui si mostra solo il locale.
async function applyLocaleBranding(){
  try{
    const rows = await sbGet('carta_settings?select=cover_pre,cover_name');
    const r = (Array.isArray(rows) && rows[0]) ? rows[0] : {};
    const name = ((r.cover_name||'')+'').trim() || 'Osteria del Melograno';
    const eb = document.querySelector('.eyebrow');
    if (eb) eb.textContent = name;
    document.title = name + ' — Scelte rapide';
  }catch(e){ /* resta il default statico */ }
}
(async function boot(){
  applyLocaleBranding();
  setMsg('Sto preparando le proposte…');
  try{
    const [rows,cfg]=await Promise.all([
      sbGet('carta_vini?select=*&archiviato=is.false&order=producer,name'),
      loadConfig()
    ]);
    if(!Array.isArray(rows)||!rows.length) throw new Error('carta_vini vuota');
    rows.forEach(r=>{ for(const k in r){ if(typeof r[k]==='string'&&r[k].trim().toLowerCase()==='null') r[k]=null; } });
    const picks=resolveSlots(rows,cfg);
    if(!picks.length) throw new Error('nessuno slot attivo');
    setMsg('');
    buildStage(picks);
    console.log('scelte: '+picks.length+' proposte da '+rows.length+' vini reali'+(cfg?' (config da Index)':' (regole automatiche)'));
  }catch(e){
    console.warn('scelte:', e.message);
    setMsg('Le proposte non sono disponibili in questo momento. Sfoglia la carta dal menu qui sotto 🍷');
  }
})();
</script>
<script>
/* Tema pilotato dal tasto globale della carta quando questa pagina è in un iframe. */
(function(){
  var embedded = window.parent && window.parent !== window;
  var tb = document.getElementById('themeToggle');
  if (embedded && tb) tb.style.display = 'none';
  function setTheme(dark){
    document.body.classList.toggle('light', !dark);
    if (tb) tb.textContent = dark ? '🌙' : '☀️';
  }
  window.addEventListener('message', function(ev){
    var d = ev && ev.data;
    if (d && d.type === 'solymar-theme') setTheme(!!d.dark);
  });
})();
</script>
